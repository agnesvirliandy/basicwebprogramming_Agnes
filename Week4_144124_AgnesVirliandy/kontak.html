<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact - PT. Kita Sukses Bersama</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container my-3">
      <!-- Navbar -->
      <nav
        class="navbar navbar-expand-lg navbar-light bg-light rounded px-3 mb-4"
      >
        <div class="container-fluid p-0">
          <a id="logo" class="navbar-brand" href="index.html">
            <img src="web-development.png" class="img-fluid" alt="Logo" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="portofolio.html">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="servis.html">Product</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="kontak.html">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- Main Content Form -->
      <main class="my-5 p-4 bg-white rounded-3 border shadow-sm">
        <h2 class="fw-bold mb-4">Hubungi Kami</h2>
        <form>
          <div class="mb-3">
            <label class="form-label fw-bold">Nama Lengkap</label>
            <input
              type="text"
              class="form-control"
              placeholder="Masukkan nama Anda..."
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="Masukkan email Anda..."
            />
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Pesan</label>
            <textarea
              class="form-control"
              rows="4"
              placeholder="Tuliskan pesan Anda di sini..."
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary fw-bold px-4">
            Kirim Pesan
          </button>
        </form>
      </main>

      <!-- Footer -->
      <footer class="p-4 bg-dark text-white rounded-3 mt-5">
        <div class="row align-items-center g-3">
          <div class="col-12 col-md-6">
            <h5 class="fw-bold">PT. Kita Sukses Bersama.</h5>
            <p class="mb-1 text-light small">
              Dark Science Boulevard<br />Blok A1 No. 45 Gading Serpong,
              Tangerang
            </p>
            <p class="mb-0 text-light small">Tel: (021) 123456789</p>
          </div>
          <div class="col-12 col-md-6 text-md-end">
            <div class="social-links mb-2">
              <img src="facebook.png" alt="Facebook" class="social-icon ms-2" />
              <img
                src="instagram.png"
                alt="Instagram"
                class="social-icon ms-2"
              />
              <img src="youtube.png" alt="YouTube" class="social-icon ms-2" />
            </div>
            <p class="copyright text-muted mb-0 small">
              Copyright © 2022 | All rights reserved
            </p>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
